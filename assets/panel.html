<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenes Skill Creator</title>
<!--
  Scenes Skill Creator — 交互原型（单文件，无依赖，双击即可打开）
  功能面与已安装插件 @cloudplugin/scenes-skill-creator 对齐：
    两类技能（通用 / 华为云基础云服务）· creator 拉取与状态 · 需求表单 ·
    真跑运行控制台（阶段 / 步骤日志 / 心跳 / 取消）· 10 分制评测（8.5 通过线，最多 3 轮）·
    按分类隔离的创建记录（本地保留全部记录）。
  在此基础上叠加了审查报告里提出的可用性改进（逐轮改动与验证记录见 README.md）。
  配色只使用主题 token 目录里已确认存在的 --dsw-alias-* 变量，并为独立打开提供了可切换的兜底配色。
-->
<style>
/* ── 1. 设计令牌：宿主 token 优先，独立打开时走兜底值（含暗色） ───────────────── */
:root{
  --p-bg:        var(--dsw-alias-bg-base, #f6f7f9);
  --p-surface:   var(--dsw-alias-bg-layer-1, #ffffff);
  --p-surface-2: var(--dsw-alias-bg-layer-2, #eff1f5);
  --p-overlay:   var(--dsw-alias-bg-overlay, #ffffff);
  --p-border:    var(--dsw-alias-border-l1, #e3e7ee);
  --p-border-2:  var(--dsw-alias-border-l2, #d2d8e3);
  --p-text:      var(--dsw-alias-label-primary, #0f172a);
  --p-text-2:    var(--dsw-alias-label-secondary, #5a6577);
  --p-accent:    var(--dsw-alias-brand-primary, #2f6bff);
  --p-ok:        var(--dsw-alias-state-success-primary, #128a4c);
  --p-warn:      var(--dsw-alias-state-warn-primary, #b26a00);
  --p-err:       var(--dsw-alias-state-error-primary, #c92a2a);
  --p-idle:      var(--dsw-alias-state-idle-primary, #8b93a5);
  --p-sidebar:   var(--dsw-specific-sidebar-fill, #ffffff);
  --p-field:     var(--dsw-alias-bg-base, #f6f7f9);   /* 输入框底色：比卡片略深，才看得出是可输入区 */
  --p-accent-soft: color-mix(in srgb, var(--p-accent) 12%, transparent);
  --p-ok-soft:     color-mix(in srgb, var(--p-ok) 12%, transparent);
  --p-warn-soft:   color-mix(in srgb, var(--p-warn) 14%, transparent);
  --p-err-soft:    color-mix(in srgb, var(--p-err) 12%, transparent);
  --p-idle-soft:   color-mix(in srgb, var(--p-idle) 14%, transparent);
  /* 淡底 chip / badge 上的文字色：把状态色压深（暗色主题下压亮）以满足 AA 4.5:1 */
  --p-ok-ink:   color-mix(in srgb, var(--p-ok) 78%, #000);
  --p-warn-ink: color-mix(in srgb, var(--p-warn) 78%, #000);
  --p-err-ink:  color-mix(in srgb, var(--p-err) 78%, #000);
  --p-idle-ink: color-mix(in srgb, var(--p-idle) 62%, #000);
  --p-accent-ink: color-mix(in srgb, var(--p-accent) 82%, #000);
  --p-on-accent: #fff;              /* 主按钮/强调底上的文字（暗色主题下换成深色） */
  --p-shadow-1: 0 1px 2px rgba(16,20,30,.06), 0 4px 16px rgba(16,20,30,.05);
  --p-shadow-2: 0 8px 32px rgba(16,20,30,.14);
  --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 18px;
  /* 控件只有两档高度：表单档 36 / 紧凑档 30（上栏、行内按钮） */
  --ctl-h: 36px; --ctl-h-sm: 30px;
  --ctl-h-ta: 148px;                 /* 文本域：放得下最长的 placeholder（6 行）且留打字余量 */
  --appbar-h: 57px;            /* 由 JS 实测同步，避免写死偏移造成接缝 */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  /* 字号阶梯：7 级，任何新字号都必须落在这 7 级里（自检 type-scale 会拦） */
  --fs-1: 11px;   /* micro：meta、徽标、分组标题 */
  --fs-2: 12px;   /* small：标签、提示、chip、小按钮 */
  --fs-3: 13px;   /* body：正文、表单、表格、对话框 */
  --fs-4: 14px;   /* emphasis：品牌、大按钮 */
  --fs-5: 16px;   /* title：pane / 对话框标题 */
  --fs-6: 19px;   /* number：评测分数 */
  --fs-7: 26px;   /* hero：评分环 */
  --lh-tight: 1.3; --lh-ui: 1.45; --lh-body: 1.6;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Mono", monospace;
  color-scheme: light;
}
[data-theme="dark"]{
  --p-bg:        var(--dsw-alias-bg-base, #0e1420);
  --p-surface:   var(--dsw-alias-bg-layer-1, #151c2a);
  --p-surface-2: var(--dsw-alias-bg-layer-2, #1d2536);
  --p-overlay:   var(--dsw-alias-bg-overlay, #1a2230);
  --p-border:    var(--dsw-alias-border-l1, #29313f);
  --p-border-2:  var(--dsw-alias-border-l2, #3a4456);
  --p-text:      var(--dsw-alias-label-primary, #eef2f8);
  --p-text-2:    var(--dsw-alias-label-secondary, #9aa6bb);
  --p-accent:    var(--dsw-alias-brand-primary, #5b8dff);
  --p-ok:        var(--dsw-alias-state-success-primary, #3ecf8e);
  --p-warn:      var(--dsw-alias-state-warn-primary, #e2a03f);
  --p-err:       var(--dsw-alias-state-error-primary, #ff6b6b);
  --p-idle:      var(--dsw-alias-state-idle-primary, #7b8598);
  --p-sidebar:   var(--dsw-specific-sidebar-fill, #14171d);
  --p-field:     var(--dsw-alias-bg-base, #0e1420);
  --p-ok-ink:   color-mix(in srgb, var(--p-ok) 86%, #fff);
  --p-warn-ink: color-mix(in srgb, var(--p-warn) 86%, #fff);
  --p-err-ink:  color-mix(in srgb, var(--p-err) 86%, #fff);
  --p-accent-ink: color-mix(in srgb, var(--p-accent) 86%, #fff);
  --p-idle-ink: color-mix(in srgb, var(--p-idle) 80%, #fff);
  --p-on-accent: #0b1020;
  --p-shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --p-shadow-2: 0 10px 40px rgba(0,0,0,.55);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --p-bg: var(--dsw-alias-bg-base, #0e1420);
    --p-surface: var(--dsw-alias-bg-layer-1, #151c2a);
    --p-surface-2: var(--dsw-alias-bg-layer-2, #1d2536);
    --p-overlay: var(--dsw-alias-bg-overlay, #1a2230);
    --p-border: var(--dsw-alias-border-l1, #29313f);
    --p-border-2: var(--dsw-alias-border-l2, #3a4456);
    --p-text: var(--dsw-alias-label-primary, #eef2f8);
    --p-text-2: var(--dsw-alias-label-secondary, #9aa6bb);
    --p-accent: var(--dsw-alias-brand-primary, #5b8dff);
    --p-ok: var(--dsw-alias-state-success-primary, #3ecf8e);
    --p-warn: var(--dsw-alias-state-warn-primary, #e2a03f);
    --p-err: var(--dsw-alias-state-error-primary, #ff6b6b);
    --p-idle: var(--dsw-alias-state-idle-primary, #7b8598);
    --p-sidebar: var(--dsw-specific-sidebar-fill, #14171d);
  --p-field: var(--dsw-alias-bg-base, #0e1420);
    --p-ok-ink: color-mix(in srgb, var(--p-ok) 86%, #fff);
    --p-warn-ink: color-mix(in srgb, var(--p-warn) 86%, #fff);
    --p-err-ink: color-mix(in srgb, var(--p-err) 86%, #fff);
    --p-accent-ink: color-mix(in srgb, var(--p-accent) 86%, #fff);
    --p-idle-ink: color-mix(in srgb, var(--p-idle) 80%, #fff);
    --p-on-accent: #0b1020;
    --p-shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --p-shadow-2: 0 10px 40px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
/* ── 2. 基础 ─────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--p-bg); color:var(--p-text);
  font-family:var(--font);font-size:var(--fs-3);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p-accent)}
::selection{background:var(--p-accent-soft)}
:focus-visible{outline:2px solid var(--p-accent); outline-offset:2px; border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* 图标：统一 16 网格 / 1.5 描边 / currentColor；尺寸只有三档 */
.i{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.i-sm{width:14px;height:14px}
.i-lg{width:19px;height:19px}
.nav-item .ico .i,.pane-head .ico .i{width:15px;height:15px}
.badge .i,.chip .i{width:13px;height:13px}
/* 粘性栏不遮挡键盘焦点（WCAG 2.2 AA：Focus Not Obscured） */
html{scroll-padding-top:84px;scroll-padding-bottom:84px}
.mono{font-family:var(--mono)}
/* 断行与光学收紧：标题断行平衡、正文避免孤字；大字号略收紧字距（Swiss 风格字重/字距配对） */
.pane-head h1,.dialog header b{text-wrap:balance;letter-spacing:-.012em}
.card-head h2,.section-head h2,.nav-group-label{text-wrap:balance}
.hint,.notice span,.dialog .body,.danger-zone,.guide .tiny,.cred-cmd p{text-wrap:pretty}
/* 等宽数字：分数、计数、耗时、指标列必须对齐（技能：表格数字用 tabular-nums） */
.mono,.score,.ring .val b,.bar-row .mono,.tl-meta,.chip,.badge,.nav-badge,.kv dd{font-variant-numeric:tabular-nums}
/* 行宽上限 70ch：正文类文本落在技能建议的 65–75 字符区间（自检 measure 会拦超宽） */
.hint,.field .err,.notice:not(.wide) span,.guide .tiny,.empty span,.deduct span,.danger-zone,.cred-cmd p,.tl-title,.field > label,.pane-head .sub{max-width:70ch}
/* 提示正文行：不设 70ch 上限，宽度跟着容器走（够宽就是一行，窄了才折行） */
.notice.wide .notice-lead{max-width:none}
.notice.wide .link{white-space:nowrap}
/* 行高：标题 1.3、密集 UI 文本 1.45、正文 1.6（unitless，允许用户放大字号） */
.pane-head h1,.dialog header b,.card-head h2,.section-head h2{line-height:var(--lh-tight)}
.tiny,.hint,.field .err,.kv dt,.kv dd,.tl-meta,.rec .when,.rec .kind,.nav-text small,.chip,.badge,.pf-row,.log-follow{line-height:var(--lh-ui)}
.muted{color:var(--p-text-2)}
.tiny{font-size:var(--fs-2)}
.row{display:flex;align-items:center;gap:var(--sp-2)}
.row-wrap{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.spacer{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.stack-lg{display:flex;flex-direction:column;gap:var(--sp-5)}
/* ── 3. 页头 ─────────────────────────────────────────────────────────────── */
.appbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:var(--sp-3);
  padding:10px var(--sp-4) 10px calc(var(--sp-4) + 10px);   /* 左内边距与菜单项图标同一条竖轴 */
  background:var(--p-sidebar); border-bottom:1px solid var(--p-border);
  backdrop-filter:saturate(180%) blur(8px);
}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(140deg,var(--p-accent),color-mix(in srgb,var(--p-accent) 55%, #7d3bff));
  color:#fff;box-shadow:var(--p-shadow-1);
}
.brand b{font-size:var(--fs-4);font-weight:650;letter-spacing:.1px}
.brand .sub{font-size:var(--fs-2);color:var(--p-text-2)}
.appbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.demo-only{display:inline-flex;align-items:center;gap:8px}
.demo-only[hidden]{display:none}
/* ── 4. 通用控件 ─────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:var(--r-md);
  padding:7px 13px;background:var(--p-surface-2);cursor:pointer;white-space:nowrap;
  transition:transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--p-text) 7%, var(--p-surface-2))}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:var(--p-accent);color:var(--p-on-accent);font-weight:600;box-shadow:var(--p-shadow-1)}
.btn-primary:hover:not(:disabled){background:color-mix(in srgb,var(--p-accent) 88%, #000)}
.btn-ghost{background:transparent;border-color:var(--p-border-2)}
.btn-ghost:hover:not(:disabled){background:var(--p-surface-2)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--p-text-2);padding:6px 9px}
.btn-quiet:hover:not(:disabled){background:var(--p-surface-2);color:var(--p-text)}
.btn-danger{background:transparent;border-color:color-mix(in srgb,var(--p-err) 45%, transparent);color:var(--p-err)}
.btn-danger:hover:not(:disabled){background:var(--p-err-soft)}
.btn:disabled{cursor:not-allowed;opacity:.5}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
.btn-sm{height:var(--ctl-h-sm);padding:0 9px;font-size:var(--fs-2);border-radius:var(--r-sm)}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--p-accent);text-decoration:underline;font-size:var(--fs-3);display:inline-flex;align-items:center;min-height:24px}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  background:var(--p-surface-2);color:var(--p-text-2);font-size:var(--fs-2);white-space:nowrap;
}
.chip.ok{background:var(--p-ok-soft);color:var(--p-ok-ink)}
.chip.warn{background:var(--p-warn-soft);color:var(--p-warn-ink)}
.chip.err{background:var(--p-err-soft);color:var(--p-err-ink)}
.chip.info{background:var(--p-accent-soft);color:var(--p-accent-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:var(--fs-2);font-weight:600;background:var(--p-idle-soft);color:var(--p-idle-ink);
}
.badge.done{background:var(--p-ok-soft);color:var(--p-ok-ink)}
.badge.active{background:var(--p-warn-soft);color:var(--p-warn-ink)}
.badge.fail{background:var(--p-err-soft);color:var(--p-err-ink)}
.badge.idle{background:var(--p-idle-soft);color:var(--p-idle-ink)}
.seg{display:inline-flex;align-items:center;background:var(--p-surface-2);border-radius:var(--r-md);padding:2px;gap:2px}
.appbar .seg{height:var(--ctl-h-sm)}
.toolbar .seg{height:var(--ctl-h)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;cursor:pointer;color:var(--p-text-2);font-size:var(--fs-3)}
.seg button[aria-pressed="true"]{background:var(--p-surface);color:var(--p-text);font-weight:600;box-shadow:var(--p-shadow-1)}
/* ── 5. 布局 ─────────────────────────────────────────────────────────────── */
.shell{
  /* 一个外壳：上栏 + (侧栏 | 画布)。零缝隙、零外边距，三块共用一条边框色 */
  display:grid;grid-template-columns:268px minmax(0,1fr);gap:0;
  padding:0;max-width:none;margin:0;align-items:stretch;
}
.col{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}
.main-col{
  min-width:0;padding:var(--sp-5) var(--sp-5) var(--sp-6);background:var(--p-bg);
  min-height:calc(100vh - var(--appbar-h, 57px));
}
#workspace{max-width:1180px}
.card{
  background:var(--p-surface);border:1px solid var(--p-border);border-radius:var(--r-lg);
  box-shadow:var(--p-shadow-1);overflow:hidden;
}
/* 创建卡与「参考与推荐」卡之间留出明确的段落间距（华为云创建页是两张卡） */
#workspace > .card + .card{margin-top:var(--sp-4)}
.card-pad{padding:var(--sp-4) var(--sp-5)}
.card-head{
  display:flex;align-items:center;gap:var(--sp-2);padding:11px var(--sp-5);
  border-bottom:1px solid var(--p-border);
}
.card-head h2{font-size:var(--fs-3);font-weight:650;letter-spacing:.2px;color:var(--p-text-2);text-transform:uppercase}
/* ── 6. 左侧菜单（唯一的导航面） ─────────────────────────────────────────── */
.sidebar{
  /* 外壳的一列：通高、与上栏同底色、只有一条右分隔线；不是圆角浮层 */
  position:sticky;top:var(--appbar-h, 57px);height:calc(100vh - var(--appbar-h, 57px));
  display:flex;flex-direction:column;gap:1px;min-width:0;overflow:auto;
  background:var(--p-sidebar);border:0;border-right:1px solid var(--p-border);
  border-radius:0;box-shadow:none;padding:var(--sp-4);
}
.nav-group-label{
  font-size:var(--fs-1);font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--p-text-2);margin:12px 10px 3px;
}
.nav-group-label:first-child{margin-top:2px}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  padding:8px 10px;border:1px solid transparent;border-radius:var(--r-md);background:transparent;
  color:var(--p-text);font:inherit;transition:background .15s ease,border-color .15s ease;
}
.nav-item:hover{background:var(--p-surface-2)}
.nav-item[aria-current="true"]{background:var(--p-accent-soft);border-color:color-mix(in srgb,var(--p-accent) 32%, transparent)}
.nav-item .ico{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--p-surface-2);color:var(--p-text-2);
}
.nav-item[aria-current="true"] .ico{background:var(--p-surface);color:var(--p-accent)}
.nav-text{flex:1 1 auto;min-width:0}
.nav-text b{display:block;font-size:var(--fs-3);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-text small{display:block;color:var(--p-text-2);font-size:var(--fs-1);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-badge{margin-left:auto;flex:0 0 auto;font-size:var(--fs-1);padding:1px 7px;border-radius:999px;background:var(--p-surface-2);color:var(--p-text-2)}
.nav-badge.live{background:var(--p-warn-soft);color:var(--p-warn-ink)}
.nav-dot{margin-left:auto;flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.nav-dot.ok{background:var(--p-ok)}
.nav-dot.warn{background:var(--p-warn)}
.nav-foot{margin-top:10px;padding:9px 10px 3px;border-top:1px solid var(--p-border);font-size:var(--fs-1);color:var(--p-text-2);display:flex;flex-direction:column;gap:4px}
/* ── 7. 工作区：一屏一卡、卡内分段 ───────────────────────────────────────── */
.pane-head{display:flex;align-items:center;gap:12px;padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--p-border);flex-wrap:wrap}
.pane-head h1{font-size:var(--fs-5);font-weight:650;line-height:1.3}
.pane-head .sub{font-size:var(--fs-2);color:var(--p-text-2);margin-top:1px}
.pane-head .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--p-accent-soft);color:var(--p-accent);flex:0 0 auto}
/* 菜单里的"暂无运行记录"：是入口不是装饰，整行可点并给出下一步 */
.nav-item.nav-empty{border-style:dashed;border-color:var(--p-border-2);background:transparent}
.nav-item.nav-empty .ico{background:transparent;color:var(--p-text-2)}
.nav-item.nav-empty .nav-badge{background:var(--p-accent-soft);color:var(--p-accent-ink)}
/* 详情页评分面板：环 + 四维在一个带底色的面板里，避免悬空 */
.score-panel{display:flex;gap:var(--sp-5);align-items:center;flex-wrap:wrap;padding:var(--sp-4);border:1px solid var(--p-border);border-radius:var(--r-md);background:var(--p-surface-2)}
.score-panel .bars{flex:1 1 280px;min-width:220px}
.score-panel .ring{flex:0 0 auto}
/* 结论文案行：图标 + 结论 + 达标线 */
.verdict-line{display:flex;align-items:center;gap:8px;margin-top:4px;padding-top:9px;border-top:1px dashed var(--p-border);flex-wrap:wrap}
.verdict-line b{font-size:var(--fs-3)}
/* 没有评分时（取消/超时/中断）不摆一个空环，而是给状态块 */
.status-panel{gap:var(--sp-3)}
.status-panel .st-ico{width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;flex:0 0 auto;background:var(--p-surface);border:1px solid var(--p-border)}
.status-panel .st-ico.warn{color:var(--p-warn-ink)} .status-panel .st-ico.err{color:var(--p-err)} .status-panel .st-ico.ok{color:var(--p-ok)}
.status-panel b{font-size:var(--fs-4)}
/* 结果页的分块标题与路径框 */
.sub-block{margin-top:var(--sp-4)}
.path-box{display:block;padding:9px 11px;border:1px solid var(--p-border);border-radius:var(--r-md);background:var(--p-surface-2);word-break:break-all}
.actions-bar .spacer{flex:1 1 auto}
/* 扣分项：两行式（条目 + 原因），左侧固定宽度的分值列 */
.deduct{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--sp-3);align-items:start;padding:9px 0;border-top:1px solid var(--p-border)}
.deduct:first-child{border-top:0;padding-top:0}
.deduct .why{display:block;color:var(--p-text-2);font-size:var(--fs-2);line-height:var(--lh-ui);max-width:70ch;margin-top:2px}
.deduct .pts{font-family:var(--mono);font-size:var(--fs-2);font-weight:650;color:var(--p-warn-ink);background:var(--p-warn-soft);border-radius:999px;padding:2px 8px;text-align:center;justify-self:start}
/* 带边框的分栏面板（详情页的阶段｜日志） */
.split.panel{border:1px solid var(--p-border);border-radius:var(--r-md);overflow:hidden;background:var(--p-surface-2)}
.split.panel > *{background:var(--p-surface)}
.tabpanel-head{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3)}
.empty .cta{margin-top:4px}
.section{padding:var(--sp-4) var(--sp-5)}
.section + .section{border-top:1px solid var(--p-border)}
.section-head{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:11px;flex-wrap:wrap}
.section-head h2{font-size:var(--fs-3);font-weight:650;letter-spacing:.2px;color:var(--p-text-2);text-transform:uppercase}
.actions-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px var(--sp-5);border-top:1px solid var(--p-border);background:var(--p-surface-2);
  position:sticky;bottom:0;z-index:5;
}
/* 操作条按钮与表单控件同高（36px）：主按钮只靠填充色/字重区分，不再靠体积 */
.actions-bar .btn{height:var(--ctl-h);padding:0 15px}
.split{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:stretch}
.split > *{padding:var(--sp-4) var(--sp-5);min-width:0}
.split > * + *{border-left:1px solid var(--p-border)}
.tabs{display:flex;gap:2px;padding:0 var(--sp-5);border-bottom:1px solid var(--p-border);flex-wrap:wrap}
.tab{
  border:0;background:transparent;padding:10px 12px;cursor:pointer;color:var(--p-text-2);
  font:inherit;font-size:var(--fs-3);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--p-text)}
.tab[aria-selected="true"]{color:var(--p-text);font-weight:600;border-bottom-color:var(--p-accent)}
/* ── 8. 表单 ─────────────────────────────────────────────────────────────── */
.preflight{display:flex;flex-direction:column;gap:8px}

/* 凭据引导里的可复制命令块 */
.cred-cmd{
  border:1px solid var(--p-border-2);border-radius:var(--r-md);background:var(--p-surface);
  padding:9px 11px;
}
.cred-cmd pre{
  margin:4px 0 0;white-space:pre-wrap;word-break:break-all;color:var(--p-text);
  background:var(--p-surface-2);border-radius:var(--r-sm);padding:7px 9px;line-height:1.55;
}
.pf-row{display:flex;align-items:center;gap:8px;font-size:var(--fs-3)}
.pf-row .grow{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── 7. 表单 ─────────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:4px}
.field > label{font-size:var(--fs-2);color:var(--p-text-2);font-weight:500}
.field .hint{font-size:var(--fs-2);color:var(--p-text-2)}
.field .err{font-size:var(--fs-2);color:var(--p-err)}
.input,select.input,textarea.input{
  width:100%;height:var(--ctl-h);background:var(--p-field);border:1px solid var(--p-border-2);
  border-radius:var(--r-md);padding:0 11px;transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
/* 输入框底色取画布色：比卡片略深（暗色下更明显），不再和卡片同色而只能靠描边辨认 */
.input:hover{border-color:color-mix(in srgb,var(--p-text) 22%, var(--p-border-2))}
.input:focus{outline:none;border-color:var(--p-accent);box-shadow:0 0 0 3px var(--p-accent-soft)}
.input::placeholder{color:var(--p-text-2);opacity:1}
.input:disabled{background:var(--p-surface-2);color:var(--p-text-2);cursor:not-allowed;border-color:var(--p-border)}
textarea.input{height:auto;padding:8px 11px;min-height:var(--ctl-h-ta);resize:vertical;line-height:1.6}
.input[aria-invalid="true"]{border-color:var(--p-err);box-shadow:0 0 0 3px var(--p-err-soft)}
/* 紧凑档：上栏与行内（与 .btn-sm / .seg 同高，整行对齐） */
.input.input-sm,select.input.input-sm{height:var(--ctl-h-sm);padding:0 9px;font-size:var(--fs-2)}
/* 复选/单选跟随品牌色，而不是浏览器默认蓝 */
input[type="checkbox"],input[type="radio"]{accent-color:var(--p-accent);width:15px;height:15px;flex:0 0 auto}
.name-row{display:flex;align-items:stretch}
.name-prefix{
  display:flex;align-items:center;padding:0 11px;border:1px solid var(--p-border-2);border-right:0;
  border-radius:var(--r-md) 0 0 var(--r-md);background:var(--p-surface-2);color:var(--p-text-2);font-size:var(--fs-3);white-space:nowrap;
}
.name-row .input{border-radius:0 var(--r-md) var(--r-md) 0}
.tax-row{display:flex;gap:var(--sp-3);align-items:flex-start}
.tax-row .field{flex:1 1 0;min-width:0}
.notice{
  display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:var(--r-md);
  background:var(--p-accent-soft);color:var(--p-text);font-size:var(--fs-3);border:1px solid color-mix(in srgb,var(--p-accent) 22%, transparent);
}
.notice.warn{background:var(--p-warn-soft);border-color:color-mix(in srgb,var(--p-warn) 30%, transparent)}
/* v4：折叠卡已并入单卡分段，旧的 details/summary 规则删除 */



/* ── 8. 运行控制台 ───────────────────────────────────────────────────────── */
.run-head{display:flex;flex-direction:column;gap:var(--sp-3)}
.progress{
  height:7px;border-radius:999px;background:var(--p-surface-2);overflow:hidden;position:relative;
}
.progress > i{
  display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p-accent),color-mix(in srgb,var(--p-accent) 60%, #7d3bff));
  transition:width .45s cubic-bezier(.4,0,.2,1);
}
.progress.striped > i::after{
  content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:sheen 1.6s linear infinite;
}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px var(--sp-4)}
.kv div{min-width:0}
.kv dt{font-size:var(--fs-1);color:var(--p-text-2)}
.kv dd{margin:1px 0 0;font-size:var(--fs-3);word-break:break-all;display:flex;align-items:center;gap:8px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;align-items:flex-start;padding:7px 0;position:relative}
.tl-item + .tl-item::before{
  content:"";position:absolute;left:9px;top:-7px;height:14px;width:2px;background:var(--p-border-2);
}
.tl-mark{
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:var(--p-surface-2);color:var(--p-idle-ink);font-size:var(--fs-1);z-index:1;
}
.tl-item.done .tl-mark{background:var(--p-ok-soft);color:var(--p-ok)}
.tl-item.active .tl-mark{background:var(--p-warn-soft);color:var(--p-warn)}
.tl-item.active .tl-title{font-weight:600}
.tl-body{flex:1 1 auto;min-width:0}
.tl-title{font-size:var(--fs-3)}
.tl-meta{font-size:var(--fs-1);color:var(--p-text-2)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.log-wrap{border:1px solid var(--p-border);border-radius:var(--r-md);overflow:hidden;background:var(--p-surface-2)}
.log-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--p-border);background:var(--p-surface);flex-wrap:wrap}
.log{
  margin:0;max-height:290px;overflow:auto;padding:9px 11px;font-family:var(--mono);font-size:var(--fs-2);line-height:1.6;
  display:flex;flex-direction:column;gap:1px;scrollbar-gutter:stable;
}
.log .ln{display:flex;gap:8px;white-space:pre-wrap;word-break:break-word}
.log .ts{color:var(--p-text-2);flex:0 0 auto}
.log .kind{flex:0 0 auto;width:34px;font-weight:600}
.log .k-info{color:var(--p-text-2)} .log .k-step{color:var(--p-text)}
.log .k-phase{color:var(--p-accent)} .log .k-warn{color:var(--p-warn)} .log .k-error{color:var(--p-err)}
.log .msg{flex:1 1 auto;color:var(--p-text)}
.log-follow{display:flex;align-items:center;gap:8px;font-size:var(--fs-2);color:var(--p-text-2);cursor:pointer;user-select:none}
/* ── 9. 评分 ─────────────────────────────────────────────────────────────── */
.ring{position:relative;width:112px;height:112px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
/* 内容必须是"一列、整体居中"：用 grid 会让数字与达标线各占一行并被 stretch 拉满，视觉上贴着上下环壁 */
.ring .val{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;text-align:center;
}
.ring .val b{font-size:var(--fs-7);line-height:1;font-weight:700}
.ring .val span{font-size:var(--fs-1);line-height:1;color:var(--p-text-2)}
.bars{display:flex;flex-direction:column;gap:8px;flex:1 1 260px;min-width:220px}
/* 运行中评测卡是纵向 stack：.bars 的 260px 是给结果页横向布局的 flex-basis，
   在纵向容器里会撑出一大段空白，把「评分」和「扣分明细」隔开。这里按内容高度收缩。 */
.section.stack > .bars{flex:0 0 auto;width:100%;min-width:0}
.bar-row{display:grid;grid-template-columns:104px 1fr 54px;gap:8px;align-items:center;font-size:var(--fs-2)}
.bar{height:6px;border-radius:999px;background:var(--p-surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--p-accent);border-radius:999px}
.deduct{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-3);padding:6px 0;border-top:1px dashed var(--p-border)}
.deduct:first-child{border-top:0}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-3)}
table.tbl th,table.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--p-border)}
table.tbl th{color:var(--p-text-2);font-weight:600;font-size:var(--fs-2)}
table.tbl tr:last-child td{border-bottom:0}
/* ── 10. 记录（主区域里的表格，不再是右栏小卡片） ───────────────────────── */
.rec-list{display:flex;flex-direction:column}
.rec{
  display:grid;grid-template-columns:auto minmax(0,1fr) 76px 62px auto;gap:12px;align-items:center;
  width:100%;text-align:left;padding:11px var(--sp-5);border:0;border-bottom:1px solid var(--p-border);
  background:transparent;cursor:pointer;font:inherit;color:inherit;
}
.rec:last-child{border-bottom:0}
.rec:hover{background:var(--p-surface-2)}
.rec[aria-current="true"]{background:var(--p-accent-soft)}
.rec .name{display:block;font-size:var(--fs-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .when{display:block;font-size:var(--fs-2);color:var(--p-text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .kind{font-size:var(--fs-2);color:var(--p-text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .score{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}
/* 记录名悬停浮窗：完整名称 + 描述 + 类型/状态，避免长文本在行内被截断后遮住后面的类型与评分 */
.rec-tip{
  position:fixed;z-index:55;max-width:min(420px,calc(100vw - 24px));
  padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--p-border-2);
  background:var(--p-surface);color:var(--p-text);box-shadow:var(--p-shadow-2);
  font-size:var(--fs-2);line-height:1.65;pointer-events:none;overflow-wrap:anywhere;
}
.rec-tip[hidden]{display:none}
.rec-tip b{display:block;font-size:var(--fs-3);line-height:1.4;margin-bottom:4px}
.rec-tip .tip-desc{white-space:pre-line}
.rec-tip .tip-meta{margin-top:6px;color:var(--p-text-2);font-size:var(--fs-1)}
.rec-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s ease}
.rec:hover .rec-actions,.rec:focus-within .rec-actions{opacity:1}
.toolbar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--p-border);background:var(--p-surface-2)}
/* ── 11. 空态 / 骨架 ─────────────────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:var(--sp-6) var(--sp-4);text-align:center;color:var(--p-text-2)}
.empty .art{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--p-surface-2);color:var(--p-accent)}
.skel{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--p-surface-2),color-mix(in srgb,var(--p-text) 8%,var(--p-surface-2)),var(--p-surface-2));background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.guide .g{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border:1px dashed var(--p-border-2);border-radius:var(--r-md);background:transparent;color:var(--p-text-2)}
.guide .n{width:20px;height:20px;border-radius:50%;background:var(--p-accent);color:var(--p-on-accent);display:grid;place-items:center;font-size:var(--fs-2);font-weight:700;flex:0 0 auto}
/* ── 11b. 参考与推荐（两个 tab，横向卡片） ─────────────────────────────── */
.refs .section-head{margin-bottom:10px}
.refs .seg button[role="tab"]{min-height:26px}
.refs .seg button[role="tab"][aria-selected="true"]{background:var(--p-surface);color:var(--p-text);font-weight:600;box-shadow:var(--p-shadow-1)}
.h-scroll{
  display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;
  scroll-snap-type:x proximity;scrollbar-width:thin;
}
.h-scroll:focus-visible{outline:2px solid var(--p-accent);outline-offset:2px;border-radius:var(--r-md)}
.ref-card{
  flex:0 0 292px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;
  min-width:0;min-height:190px;padding:12px;border:1px solid var(--p-border);
  border-radius:var(--r-md);background:var(--p-surface-2);
}
.ref-kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px}
.ref-idx{font-size:var(--fs-1);color:var(--p-text-2)}
.ref-name{
  font-size:var(--fs-1);color:var(--p-text-2);max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ref-l2{font-size:var(--fs-1);color:var(--p-text-2);white-space:nowrap}
.ref-title{
  margin:0;font-size:var(--fs-3);font-weight:650;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.ref-desc{
  margin:0;font-size:var(--fs-2);color:var(--p-text-2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.ref-chips{display:flex;gap:4px;flex-wrap:wrap;max-height:22px;overflow:hidden}
.ref-chips .chip{
  display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:var(--fs-1);padding:2px 7px;
}
.ref-foot{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.ref-link{
  display:inline-flex;align-items:center;gap:4px;min-height:24px;
  font-size:var(--fs-2);color:var(--p-accent);text-decoration:none;white-space:nowrap;
}
.ref-link:hover{text-decoration:underline}
.ref-sites{
  display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;
  margin-top:2px;padding-top:10px;border-top:1px solid var(--p-border);
}
.ref-sites .tiny{flex:0 0 auto}
.ref-site{
  display:inline-flex;align-items:center;gap:4px;min-height:24px;
  font-size:var(--fs-2);color:var(--p-accent);text-decoration:none;white-space:nowrap;
}
.ref-site:hover{text-decoration:underline}
.ref-empty{display:flex;align-items:center;justify-content:center;padding:var(--sp-4);border:1px dashed var(--p-border-2);border-radius:var(--r-md);text-align:center}
@media (max-width:860px){.ref-card{flex-basis:260px}}
/* ── 12. 对话框 / 提示条 ─────────────────────────────────────────────────── */
.backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(10,12,18,.42);display:grid;place-items:center;padding:var(--sp-5);
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{
  width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--p-overlay);border:1px solid var(--p-border);
  border-radius:var(--r-xl);box-shadow:var(--p-shadow-2);animation:pop .18s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.dialog header{padding:var(--sp-5) var(--sp-5) var(--sp-2);display:flex;gap:8px;align-items:flex-start}
.dialog .body{padding:0 var(--sp-5) var(--sp-4);font-size:var(--fs-3)}
.dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:var(--sp-3) var(--sp-5) var(--sp-5);flex-wrap:wrap}
/* 案例视频弹窗：比普通对话框宽，播放器保持 16:9 */
.dialog-video{width:min(760px,100%)}
.video-wrap{
  background:#000;border:1px solid var(--p-border);border-radius:var(--r-md);
  overflow:hidden;
}
.video-wrap video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{

async function loadLiveRefData() {
  if (!S.apiLive || S.mode !== "huawei") return;
  const id = refCategoryId();
  let changed = false;
  if (!S.refLive.cases) {
    try {
      const r = await fetch(API_BASE + "/cases", { headers: { Accept: "application/json" } });
      if (r.ok) {
        const arr = await r.json();
        if (Array.isArray(arr) && arr.length) { S.refLive.cases = arr.map(normalizeCase); changed = true; }
      }
    } catch (_) { /* CORS / 离线 → 保持快照 */ }
  }
  if (!S.refLive.reco[id]) {
    try {
      const r = await fetch(API_BASE + "/skill/search-skills", {
        method: "POST",
        headers: { Accept: "application/json", "Content-Type": "application/json" },
        body: JSON.stringify({ category_l1_id: id, sort: "hot", page: 1, size: 8 }),
      });
      if (r.ok) {
        const j = await r.json();
        if (j && Array.isArray(j.content)) { S.refLive.reco[id] = j.content.map(normalizeSkill); changed = true; }

function renderSidebar(force) {

      const bg = bgOf(el);

      const size = parseFloat(cs.fontSize) || 13;
      const big = size >= 18.66 || (size >= 14 && parseInt(cs.fontWeight, 10) >= 700);
      const need = big ? 3 : 4.5;
      if (cr < need) fails.push(`${name}=${cr}<${need}`);
    }
    push("contrast-AA", fails.length === 0, fails.join(" ") || `all ${measured} sampled texts >= AA`);
    // 选择器不存在时样本会静默消失 → 单独断言覆盖率（不同屏控件数量本来就不同）
    const needSamples = (S.view === "form" || S.view === "run") ? 4 : (S.view === "result" ? 3 : 2);
    push("contrast-sample-coverage", measured >= needSamples && unparsed.length === 0,
      `measured ${measured}/${samples.length} (need ${needSamples}); unparsed: ${unparsed.join(",") || "none"}; absent: ${missing.join(",") || "none"}`);
    /* 7b. EN 界面不得残留中文界面文案
       范围=整个文档的叶子文本，排除日志/记录/用户输入/代码/语言按钮/对话框；阈值 0
       （上一版只扫 #main，把顶栏里的硬编码中文漏掉了，这就是它当时能报 0 的原因） */
    if (S.lang === "en") {
      const EXCLUDE = "script, style, #log, .rec-list, textarea, code, pre, #btn-lang, #live-status, .toasts, #dialog-root, [data-user], [data-ext]";
      let cjk = 0; const where = [];
      Array.from(document.querySelectorAll("body *")).forEach((n) => {
        if (n.children.length) return;                       // 只看叶子
        if (n.closest(EXCLUDE)) return;
        const hits = ((n.textContent || "").match(/[\u4e00-\u9fff]/g) || []).length;
        if (hits) { cjk += hits; where.push((n.className || n.tagName) + ":" + (n.textContent || "").trim().slice(0, 10)); }
      });
      push("no-cjk-in-en-ui", cjk === 0, `CJK leaves = ${cjk}${where.length ? " @ " + where.slice(0, 4).join(" | ") : ""}`);
      // 属性口径单独一条：title / aria-label 里的中文（上一版只扫文本节点，把 7 个属性的中文漏了）
      const attrFails = [];
      document.querySelectorAll("[title], [aria-label]").forEach((n) => {
        if (n.closest("#dialog-root, [data-user], [data-ext]")) return;
        ["title", "aria-label"].forEach((a) => {
          const v = n.getAttribute(a) || "";
          if (/[\u4e00-\u9fff]/.test(v)) attrFails.push((n.id || n.className || n.tagName) + "@" + a + "=" + v.slice(0, 12));
        });
      });
      push("no-cjk-in-en-attrs", attrFails.length === 0, attrFails.slice(0, 6).join(" | ") || "no CJK in title/aria-label");
    }
    /* 8. 触达目标 ≥ 24px（WCAG 2.2 AA） */
    const small = [];
    document.querySelectorAll("button, .rec, [role=button]").forEach((b) => {
      const r = b.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) return;
      if (r.height < 24) small.push((b.id || b.className || b.tagName) + ":" + Math.round(r.height));
    });
    push("targets-24px", small.length === 0, small.join(",") || "all interactive >= 24px");
    /* 9. 非预期裁切（排除本身可滚动的容器） */
    const clipped = [];
    document.querySelectorAll("#main .card span, #main .card td, .card .tiny").forEach((el) => {
      const cs = getComputedStyle(el);
      if (cs.overflow !== "visible" || el.scrollWidth > el.clientWidth + 2) {
        if (el.scrollWidth > el.clientWidth + 2 && cs.textOverflow !== "ellipsis") clipped.push((el.className || el.tagName) + ":" + el.scrollWidth + ">" + el.clientWidth);
      }
    });
    push("no-unexpected-clipping", clipped.length === 0, clipped.slice(0, 6).join(",") || "none");
    /* 10. 文案表完整性：界面上不应出现未翻译的 key */
    const leaked = Array.from(document.querySelectorAll("body *"))
      .filter((n) => n.children.length === 0 && /^[a-z]+([A-Z][a-zA-Z]*)+$/.test(n.textContent.trim()))
      .map((n) => n.textContent.trim());
    push("no-untranslated-keys", leaked.length === 0, leaked.slice(0, 6).join(",") || "none");
    /* 11. 交互抽查：分类切换必须真的生效（静态检查漏掉过这个 P0） */
    try {
      if (S.view !== "form") {
        push("mode-switch-works", true, `skipped: view=${S.view} (mode menu is disabled outside the form)`);
      } else {
        const before = S.mode;
        const target = before === "generic" ? "huawei" : "generic";   // 永远切到另一个分类（只剩两类）
        const h1 = () => { const n = document.querySelector("#main h1"); return n ? n.textContent : ""; };
        const titleBefore = h1();
        const btn = document.querySelector('.mode-item[data-mode="' + target + '"]');
        if (btn) {
          btn.click();
          const titleAfter = h1();
          push("mode-switch-works", S.mode === target && titleAfter !== titleBefore,
            `${before}->${S.mode}, title "${titleBefore}"->"${titleAfter}"`);
          const back = document.querySelector('.mode-item[data-mode="' + before + '"]');
          if (back) back.click();
        } else push("mode-switch-works", false, "mode button missing");
      }
    } catch (err) { push("mode-switch-works", false, String(err)); }
    /* 12. 记录详情「返回」：必须回到创建记录列表（不是表单） */
    if (S.view === "result") {
      try {
        const backBtn = $("btn-back");
        const label = backBtn ? backBtn.textContent.replace(/\s+/g, " ").trim() : "";
        if (backBtn) backBtn.click();
        push("result-back-to-records", !!backBtn && S.view === "records" && label.indexOf(t("backToRecords")) !== -1,
          `label="${label}" view=${S.view}`);
      } catch (err) { push("result-back-to-records", false, String(err)); }
    }
    /* 12b. 记录不再按 20 条截断：灌 25 条新记录后，最旧的测试记录必须还在 */
    try {
      const backupRuns = S.runs.slice();
      for (let i = 0; i < 25; i++) {
        upsertRun({ id: "selftest-cap-" + i, kind: "generic", status: "done", score: 9, verdict: "pass", round: 1,
          startedAt: now(), lastActivityAt: now(), spec: { description: "cap test " + i }, phases: [], steps: [] });
      }
      const noCap = S.runs.some((r) => r.id === "selftest-cap-0") && S.runs.length >= backupRuns.length + 25;
      push("runs-no-cap", noCap, `before=${backupRuns.length} after=${S.runs.length} oldestKept=${S.runs.some((r) => r.id === "selftest-cap-0")}`);
      S.runs = backupRuns; saveRuns();
    } catch (err) { push("runs-no-cap", false, String(err)); }
    out.stats = { controls: controls.length, buttons: document.querySelectorAll("button").length, runs: S.runs.length, steps: S.run ? (S.run.steps || []).length : 0 };
    out.failed = out.checks.filter((c) => !c.ok).length;
    const pre = document.createElement("pre");
    pre.id = "selftest-results";
    pre.textContent = JSON.stringify(out, null, 1);
    document.body.appendChild(pre);
  }
  setTimeout(run, delay);
})();
/* ═══════════════════════════════════════════════════════════════════════════
   16. 流程回归（真点、真等，不靠静态断言）
       ?flowtest=1 开始 → 取消：验证取消是终局（P0-2 就是这么被抓到的）
       ?flowtest=2 后台运行结束：验证它不会抢走你正在看的视图（NEW-1/NEW-2）
       ?flowtest=3 在别的页时运行结束：菜单徽标与焦点必须跟着结束
   ═══════════════════════════════════════════════════════════════════════════ */
(function flowTest() {
  const mode = new URLSearchParams(location.search).get("flowtest");
  if (mode !== "1" && mode !== "2" && mode !== "3") return;
  const out = { scenario: mode, steps: [], ok: false };
  const rec = (k, v) => out.steps.push(k + "=" + v);
  const emit = () => {
    const pre = document.createElement("pre");
    pre.id = "flowtest-results";
    pre.textContent = JSON.stringify(out, null, 1);
    document.body.appendChild(pre);
  };
  if (mode === "1") {
    setTimeout(() => {
      S.mode = "generic"; S.draft.generic = EXAMPLES.generic; S.demo = "fix";
      startRun();
      rec("started", S.live ? "live" : "none");
      rec("inRecords", String(S.runs.some((r) => r.id === (S.live && S.live.id))));
    }, 300);
    setTimeout(() => { rec("viewAt2s", S.view); rec("statusAt2s", S.live ? S.live.status : "none"); doCancel(); rec("afterCancel", S.run ? S.run.status : "none"); }, 2600);
    setTimeout(() => {
      const ids = S.runs.map((r) => r.id);
      out.duplicateIds = ids.length - new Set(ids).size;
      out.statusAfterWait = S.run ? S.run.status : "none";
      out.liveAfterWait = !!S.live;
      out.timersLeft = S.timers.size;
      out.tickerLeft = !!S.ticker;
      out.runsLength = S.runs.length;
      out.ok = out.duplicateIds === 0 && out.statusAfterWait === "cancelled" && !out.liveAfterWait && !out.tickerLeft && out.timersLeft === 0;
      emit();
    }, 12000);
    return;
  }
  /* flowtest=2：后台运行结束时，用户正在看别的记录 —— 视图与焦点都不许被抢 */
  if (mode === "2") {
  setTimeout(() => {
    S.mode = "generic"; S.draft.generic = EXAMPLES.generic; S.demo = "success";
    startRun();
    rec("started", S.live ? "live" : "none");
  }, 300);
  setTimeout(() => {
    const other = S.runs.find((r) => r.status === "done" && (!S.live || r.id !== S.live.id));
    if (!other) { out.ok = false; rec("noOtherRecord", "true"); emit(); return; }
    out.otherId = other.id;
    openRun(other.id);
    rec("viewed", S.run.id);
    rec("view", S.view);
  }, 1600);
  setTimeout(() => {
    out.viewAfterFinish = S.view;
    out.viewedId = S.run && S.run.id;
    out.stillOnOtherRecord = out.viewedId === out.otherId;
    out.liveAfterFinish = !!S.live;
    out.formIntact = !!document.querySelector("#workspace .card");
    out.ok = out.viewAfterFinish === "result" && out.stillOnOtherRecord && !out.liveAfterFinish && out.formIntact;
    emit();
  }, 22000);
  return;
  }
/* flowtest=3：用户在别的页时后台运行结束 —— 菜单里的"当前运行"行必须消失（最近一次运行菜单也已移除） */
setTimeout(() => {
  S.mode = "generic"; S.draft.generic = EXAMPLES.generic; S.demo = "success";
  startRun();
  rec("started", S.live ? "live" : "none");
}, 300);
setTimeout(() => {
  S.view = "env"; renderAll();
  rec("onEnv", S.view);
  rec("badgeWhileLive", String(!!document.querySelector(".nav-badge.live")));
  const item = document.querySelector('[data-nav="records"]');
  if (item) item.focus();                        // 键盘用户在菜单里：状态跃迁不得把焦点丢到 body
  out.focusBefore = document.activeElement && document.activeElement.dataset ? (document.activeElement.dataset.nav || document.activeElement.tagName) : "none";
}, 1500);
setTimeout(() => {
  out.liveAfter = !!S.live;
  out.liveBadgeAfter = !!document.querySelector(".nav-badge.live");
  out.runRowAfter = !!document.querySelector('[data-nav="run"]');
  out.sideSummary = ($("side-summary") || {}).textContent || "none";
  const a = document.activeElement;
  out.focusAfter = a && a.dataset ? (a.dataset.nav || a.dataset.mode || a.tagName) : "none";
  out.focusKept = out.focusAfter === "records";
  out.ok = !out.liveAfter && !out.liveBadgeAfter && !out.runRowAfter && out.focusKept;
  emit();
}, 26000);
})();
</script>
